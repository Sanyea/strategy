apiVersion: v1
kind: Secret
metadata:
  name: minio-account-secret
  namespace: dev
type: Opaque
data:
  # 明文 minio
  root-user: bWluaW8xMjM0NTY=
  # 明文 minio123456
  root-password: bWluaW8xMjM0NTY=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mino-dev
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mino-dev
  template:
    metadata:
      labels:
        app: mino-dev
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          imagePullPolicy: IfNotPresent
          command: ["minio","server","/data","--console-address",":9001"]
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: webui
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-account-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-account-secret
                  key: root-password
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          hostPath:
            path: /data/dev/minio
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mino-dev-svc
  namespace: dev
spec:
  type: NodePort
  selector:
    app: mino-dev
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 31000
      name: api
    - port: 9001
      targetPort: 9001
      nodePort: 31001
      name: webui