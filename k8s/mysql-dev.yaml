apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: dev
type: Opaque
data:
  # 明文: mysql123456
  root-password: bXlzcWwxMjM0NTY=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-dev
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-dev
  template:
    metadata:
      labels:
        app: mysql-dev
    spec:
      containers:
      - name: mysql
        image: docker.io/library/mysql:8.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: root-password
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-data
        hostPath:
          path: /data/dev/mysql
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-dev-nodeport
  namespace: dev
spec:
  type: NodePort
  selector:
    app: mysql-dev
  ports:
  - port: 3306
    targetPort: 3306
    nodePort: 30306
