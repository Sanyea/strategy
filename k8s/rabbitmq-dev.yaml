apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-dev
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-dev
  template:
    metadata:
      labels:
        app: rabbitmq-dev
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "rabbitmq123456"
            - name: RABBITMQ_DEFAULT_PASS
              value: "rabbitmq123456"
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: rabbitmq-data
          hostPath:
            path: /data/dev/rabbitmq
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-dev-svc
  namespace: dev
spec:
  type: NodePort
  selector:
    app: rabbitmq-dev
  ports:
    - port: 5672
      targetPort: 5672
      nodePort: 31672
      name: amqp
    - port: 15672
      targetPort: 15672
      nodePort: 31673
      name: management