spring:
  profiles:
    active: dev

mybatis-plus:
  # 约定式枚举映射：扫描 TypeHandler（DeleteFlagEnumTypeHandler 桥接 IPersistEnum）
  type-handlers-package: com.sanye.strategy.common.config

jwt:
  # 生产环境必须经环境变量 JWT_SECRET 覆盖（≥32 字节）；dev 默认值仅本地联调用，不入库不进代码
  secret: ${JWT_SECRET:dev-only-jwt-secret-0123456789abcdef0123456789abcdef}
  access-token-ttl-minutes: 30